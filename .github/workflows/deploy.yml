# Publishes the built site (the committed site/ folder) to Cloudflare Pages whenever it changes on main.
# Rebuild first on your computer (work/build-site.ps1), commit site/ and push; this workflow only uploads it.
# One-time setup: add the repository secret CLOUDFLARE_API_TOKEN (Settings > Secrets and variables > Actions).
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check the token is set
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the repository secret CLOUDFLARE_API_TOKEN (Cloudflare API token with Account > Cloudflare Pages > Edit)."
            exit 1
          fi

      - name: Check the build output
        run: |
          test -f site/index.html
          test -f site/_worker.js
          test -f site/_routes.json
          test -f site/data/site.json
          echo "site/ looks complete: $(find site -type f | wc -l) files"

      - name: Deploy to Cloudflare Pages (kaitorinihon, production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4e2ccc3acd4e023580096d2e8a88d05e
          command: pages deploy site --project-name=kaitorinihon --branch=main --commit-dirty=true
